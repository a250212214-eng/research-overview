// ── 找回面板：找回已收藏但缺失的文章 ──
function toggleRecover() {
    var p = document.getElementById('recoverPanel');
    if (p.style.display === 'none') { renderRecover(); p.style.display = 'block'; p.scrollIntoView({behavior:'smooth'}); }
    else { p.style.display = 'none'; }
}

function catalogByTid() {
    var m = {};
    for (var i = 0; i < CATALOG.length; i++) m[CATALOG[i].t] = CATALOG[i];
    return m;
}

function renderRecover() {
    var p = document.getElementById('recoverPanel');
    var data = getData();
    var savedIds = {};
    for (var i = 0; i < data.length; i++) savedIds[data[i].tid] = true;
    var catByTid = catalogByTid();

    // 1) 已收藏(zsxq_bm_*)但不在研究积累中的文章
    var missing = [];
    for (var k in localStorage) {
        if (k.indexOf('zsxq_bm_') !== 0) continue;
        var date = k.substring(8);
        var bm = {};
        try { bm = JSON.parse(localStorage.getItem(k) || '{}'); } catch(e) { continue; }
        for (var tid in bm) {
            if (!savedIds[tid] && !deletedTids.has(tid)) missing.push({ d: date, t: tid, s: bm[tid] });
        }
    }
    missing.sort(function(a, b) { return b.d.localeCompare(a.d); });

    var html = '';
    if (missing.length > 0) {
        html += '<div style="font-weight:700;color:#c0392b;margin-bottom:8px">⚠ 发现 ' + missing.length + ' 条已收藏但未进入研究积累的文章 — 点击右侧「找回」打开对应日报自动补回：</div>';
        for (var i = 0; i < missing.length; i++) {
            var it = missing[i];
            var cat = catByTid[it.t];
            var link = cat ? (escapeHtml(cat.f) + '#fav-' + it.t) : '';
            html += '<div style="display:flex;gap:8px;align-items:center;padding:3px 0;border-bottom:1px dashed #d6eaf8">'
                 + '<span style="color:#999;flex-shrink:0;font-size:12px">' + escapeHtml(it.d) + '</span>'
                 + '<span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + escapeHtml(String(it.s || it.t)) + '</span>'
                 + (link ? '<a href="' + link + '" target="_blank" style="flex-shrink:0;font-size:12px;color:#2471a3;text-decoration:none;border:1px solid #2471a3;border-radius:3px;padding:1px 8px">找回</a>'
                        : '<span style="flex-shrink:0;font-size:11px;color:#999">日报文件缺失</span>')
                 + '</div>';
        }
        html += '<div style="color:#7f8c8d;font-size:12px;margin:8px 0 4px">也可以直接打开对应日期的日报页面，页面会自动同步全部已收藏文章。</div>';
    } else {
        html += '<div style="color:#27ae60;font-weight:600;margin-bottom:8px">✅ 所有已收藏的文章均已在研究积累中，没有缺失。</div>';
    }

    // 2) 上一版本回滚
    var prevLen = 0;
    try { prevLen = JSON.parse(localStorage.getItem('zsxq_saved_prev') || '[]').length; } catch(e) {}
    html += '<hr style="border:none;border-top:1px solid #d6eaf8;margin:10px 0">'
         + '<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">'
         + '<span style="font-weight:600">🔁 上一版本备份：' + prevLen + ' 条</span>'
         + '<button class="ctrl-btn" style="font-size:12px;padding:2px 10px" onclick="restorePrev()">从上一版本追加恢复</button>'
         + '</div>';

    // 3) 全量目录搜索（按标题关键词找回任意文章）
    html += '<hr style="border:none;border-top:1px solid #d6eaf8;margin:10px 0">'
         + '<div style="font-weight:600;margin-bottom:6px">🔎 按标题搜索全部日报文章（目录共 ' + CATALOG.length + ' 条，仅列出不在研究积累中的）</div>'
         + '<input type="text" id="recoverSearch" placeholder="输入关键词，如：茅台 / 算力 / 储能…" onkeyup="renderRecoverSearch()" '
         + 'style="width:100%;padding:6px 10px;border:1px solid #bbb;border-radius:4px;font-size:13px;margin-bottom:6px;font-family:inherit">'
         + '<div id="recoverResults"></div>';

    p.innerHTML = html;
}

function renderRecoverSearch() {
    var q = (document.getElementById('recoverSearch').value || '').trim().toLowerCase();
    var box = document.getElementById('recoverResults');
    if (!q) { box.innerHTML = ''; return; }
    var data = getData();
    var ids = {};
    for (var i = 0; i < data.length; i++) ids[data[i].tid] = true;
    var rows = [];
    var shown = 0;
    for (var i = 0; i < CATALOG.length && shown < 60; i++) {
        var it = CATALOG[i];
        if (ids[it.t] || deletedTids.has(it.t)) continue;
        if (String(it.s || '').toLowerCase().indexOf(q) === -1) continue;
        rows.push('<div style="display:flex;gap:8px;align-items:center;padding:3px 0;border-bottom:1px dashed #d6eaf8">'
            + '<span style="color:#999;flex-shrink:0;font-size:12px">' + escapeHtml(it.d) + '</span>'
            + '<span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + escapeHtml(String(it.s)) + '</span>'
            + '<a href="' + escapeHtml(it.f) + '#fav-' + it.t + '" target="_blank" style="flex-shrink:0;font-size:12px;color:#2471a3;text-decoration:none;border:1px solid #2471a3;border-radius:3px;padding:1px 8px">找回</a>'
            + '</div>');
        shown++;
    }
    box.innerHTML = rows.join('') || '<div style="color:#999;padding:6px 0">未找到匹配的文章（或匹配的都已在研究积累中）</div>';
}

function restorePrev() {
    var prev = [];
    try { prev = JSON.parse(localStorage.getItem('zsxq_saved_prev') || '[]'); } catch(e) {}
    if (prev.length === 0) { alert('没有可用的上一版本备份'); return; }
    var data = getData();
    var ids = {};
    for (var i = 0; i < data.length; i++) ids[data[i].tid] = true;
    var added = 0;
    for (var i = 0; i < prev.length; i++) {
        if (!ids[prev[i].tid]) {
            deletedTids.delete(prev[i].tid);
            data.push(prev[i]);
            added++;
        }
    }
    if (added > 0) { saveData(data); persistData(); render(); renderRecover(); }
    alert('已从上一版本追加恢复 ' + added + ' 条（只增不改，未覆盖现有内容）');
}

function getData() {
    if (workingData === null) {
        try { workingData = JSON.parse(localStorage.getItem('zsxq_saved') || '[]'); } catch(e) { workingData = []; }
        try { var sd = JSON.parse(localStorage.getItem('zsxq_deleted') || '[]'); for (var i = 0; i < sd.length; i++) deletedTids.add(sd[i]); } catch(e) {}
    }
    return workingData;
}

function escapeHtml(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function saveData(data) {
    workingData = data;
    hasUnsaved = true;
    updateSaveBtn();
}

function persistData() {
    // 保存前快照上一版本，供「找回」面板回滚
    var prev = localStorage.getItem('zsxq_saved');
    if (prev !== null && prev !== JSON.stringify(workingData)) {
        localStorage.setItem('zsxq_saved_prev', prev);
    }
    localStorage.setItem('zsxq_saved', JSON.stringify(workingData));
    localStorage.setItem('zsxq_deleted', JSON.stringify(Array.from(deletedTids)));
    hasUnsaved = false;
    updateSaveBtn();
    var btn = document.getElementById('btnSave');
    if (btn) { btn.textContent = '✓ 已保存'; setTimeout(function(){ if (!hasUnsaved) btn.textContent = '💾 保存'; }, 1500); }
    var ss = document.getElementById('syncStatus');
    if (ss) ss.textContent = '当前: ' + workingData.length + ' 条 | ✅ 已保存';
}

function exportData() {
    var exportObj = {
        exportTime: new Date().toISOString(),
        saved: workingData,
        deleted: Array.from(deletedTids),
        bookmarks: {}
    };
    for (var k in localStorage) {
        if (k.indexOf('zsxq_bm_') === 0) exportObj.bookmarks[k] = localStorage.getItem(k);
    }
    var blob = new Blob([JSON.stringify(exportObj, null, 2)], {type: 'application/json'});
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    var d = new Date();
    a.download = '研究积累备份_' + d.getFullYear() + String(d.getMonth()+1).padStart(2,'0') + String(d.getDate()).padStart(2,'0') + '.json';
    a.click();
    URL.revokeObjectURL(a.href);
    var ss = document.getElementById('syncStatus');
    if (ss) ss.textContent = '当前: ' + workingData.length + ' 条 | 📥 已导出备份';
}

function importData(event) {
    var file = event.target.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function(e) {
        try {
            var data = JSON.parse(e.target.result);
            if (!data.saved) { alert('文件格式不正确：缺少 saved 字段'); return; }
            if (!confirm('即将导入 ' + data.saved.length + ' 条数据，将覆盖当前内容。确定继续？')) return;
            workingData = data.saved;
            deletedTids = new Set(data.deleted || []);
            if (data.bookmarks) {
                for (var k in data.bookmarks) localStorage.setItem(k, data.bookmarks[k]);
            }
            persistData();
            render();
            var ss = document.getElementById('syncStatus');
            if (ss) ss.textContent = '当前: ' + workingData.length + ' 条 | 📤 已导入数据';
        } catch(err) {
            alert('导入失败: ' + err.message);
        }
    };
    reader.readAsText(file);
    event.target.value = '';
}

function updateSaveBtn() {
    var btn = document.getElementById('btnSave');
    if (!btn) return;
    if (hasUnsaved) { btn.textContent = '💾 保存 *'; btn.classList.add('unsaved'); }
    else { btn.textContent = '💾 保存'; btn.classList.remove('unsaved'); }
    var ss = document.getElementById('syncStatus');
    if (ss) ss.textContent = '当前: ' + workingData.length + ' 条' + (hasUnsaved ? ' | ⚠ 有未保存的修改' : ' | ✅ 已保存');
}

function toggleEdit(tid) {
    var titleEl = document.getElementById('title-' + tid);
    var btn = document.querySelector('#cardList .card[data-tid="' + tid + '"] .edit-btn');
    if (!titleEl || !btn) return;
    var input = titleEl.querySelector('input.edit-input');
    if (input) {
        // 保存并退出编辑: 从 input 取值更新
        var newTitle = input.value.trim() || titleEl.getAttribute('data-orig') || '';
        updateTitle(tid, newTitle);
        titleEl.textContent = newTitle;
        titleEl.classList.remove('editing');
        btn.textContent = '✎ 编辑';
        btn.classList.remove('edit-mode');
    } else {
        // 进入编辑: 替换为 input
        var origText = titleEl.textContent.trim();
        titleEl.setAttribute('data-orig', origText);
        titleEl.innerHTML = '';
        var input = document.createElement('input');
        input.type = 'text';
        input.className = 'edit-input';
        input.value = origText;
        input.setAttribute('spellcheck', 'false');
        titleEl.appendChild(input);
        titleEl.classList.add('editing');
        btn.textContent = '✔ 保存';
        btn.classList.add('edit-mode');
        setTimeout(function() { input.focus(); input.select(); }, 50);
    }
}

function toggleEditAll() {
    var btn = document.getElementById('btnEditAll');
    var hasInput = document.querySelector('.edit-input');
    if (hasInput) {
        // 全部保存
        var inputs = document.querySelectorAll('.edit-input');
        var data = getData();
        for (var i = 0; i < inputs.length; i++) {
            var inp = inputs[i];
            var titleEl = inp.parentElement;
            var card = titleEl.closest('.card');
            if (!card) continue;
            var tid = card.dataset.tid;
            var newTitle = inp.value.trim() || titleEl.getAttribute('data-orig') || '';
            // 更新 localStorage
            for (var j = 0; j < data.length; j++) {
                if (data[j].tid === tid) { data[j].title = newTitle; break; }
            }
            // 退出编辑：清除 input，恢复文字，去样式
            titleEl.innerHTML = '';
            titleEl.textContent = newTitle;
            titleEl.classList.remove('editing');
        }
        saveData(data);
        btn.innerHTML = '✎ 全部编辑';
        // 同步全部编辑按钮状态
        var editBtns = document.querySelectorAll('#cardList .edit-btn');
        for (var k = 0; k < editBtns.length; k++) {
            editBtns[k].textContent = '✎ 编辑';
            editBtns[k].classList.remove('edit-mode');
        }
        try { renderTOC(); } catch(e) {}
    } else {
        // 全部进入编辑
        var cards = document.querySelectorAll('#cardList .card');
        for (var i = 0; i < cards.length; i++) {
            var card = cards[i];
            var titleEl = card.querySelector('.card-title');
            if (!titleEl) continue;
            var origText = titleEl.textContent.trim();
            titleEl.setAttribute('data-orig', origText);
            titleEl.innerHTML = '';
            var input = document.createElement('input');
            input.type = 'text';
            input.className = 'edit-input';
            input.value = origText;
            input.setAttribute('spellcheck', 'false');
            titleEl.appendChild(input);
            titleEl.classList.add('editing');
        }
        var firstInput = document.querySelector('.edit-input');
        if (firstInput) setTimeout(function() { firstInput.focus(); firstInput.select(); }, 50);
        btn.innerHTML = '✔ 全部保存';
        // 同步全部编辑按钮状态
        var editBtns2 = document.querySelectorAll('#cardList .edit-btn');
        for (var m = 0; m < editBtns2.length; m++) {
            editBtns2[m].textContent = '✔ 保存';
            editBtns2[m].classList.add('edit-mode');
        }
    }
}

function changeLevel(tid, newLvl, event) {
    if (event) event.stopPropagation();
    var data = getData();
    for (var i = 0; i < data.length; i++) {
        if (data[i].tid === tid) {
            data[i].level = newLvl;
            break;
        }
    }
    saveData(data);
    renderTOC();
    renderMain();
}


function updateTitle(tid, newTitle) {
    var data = getData();
    for (var i = 0; i < data.length; i++) {
        if (data[i].tid === tid) { data[i].title = newTitle; break; }
    }
    saveData(data);
    renderTOC();
}

function scrollToToc(tid) {
    var card = document.querySelector('#cardList .card[data-tid="' + tid + '"]');
    if (!card) return;
    card.scrollIntoView({ behavior: 'smooth', block: 'start' });
    card.classList.add('highlight');
    setTimeout(function(){ card.classList.remove('highlight'); }, 1500);
}

// 折叠状态管理 {key: true=折叠}
var tocCollapsed = {};
var tocEditMode = false;

function toggleTocEdit() {
    tocEditMode = !tocEditMode;
    var btn = document.getElementById('btnTocEdit');
    btn.textContent = tocEditMode ? '✔ 完成' : '✎ 编辑';
    btn.style.background = tocEditMode ? '#f39c12' : '';
    btn.style.color = tocEditMode ? '#fff' : '';
    btn.style.borderColor = tocEditMode ? '#f39c12' : '';
    renderTOC();
}

function moveItem(tid, direction) {
    // direction: -1=上移, 1=下移；在日期组内按显示顺序移动
    var data = getData();
    // 按日期分组（保持原顺序）
    var groups = {};
    var dateOrder = [];
    for (var i = 0; i < data.length; i++) {
        var dt = data[i].date || '未知日期';
        if (!groups[dt]) { groups[dt] = []; dateOrder.push(dt); }
        groups[dt].push(i); // 存索引
    }
    // 找到 tid 所在的日期组和组内位置
    var foundIdx = -1;
    var foundDate = '';
    var groupIdx = -1;
    for (var gi = 0; gi < dateOrder.length; gi++) {
        var dk = dateOrder[gi];
        var indices = groups[dk];
        for (var j = 0; j < indices.length; j++) {
            if (data[indices[j]].tid === tid) {
                foundIdx = indices[j];
                foundDate = dk;
                groupIdx = j;
                break;
            }
        }
        if (foundIdx >= 0) break;
    }
    if (foundIdx < 0) return;
    var targetGroupIdx = groupIdx + direction;
    var dateIndices = groups[foundDate];
    if (targetGroupIdx < 0 || targetGroupIdx >= dateIndices.length) return;
    var targetIdx = dateIndices[targetGroupIdx];
    // 交换
    var tmp = data[foundIdx];
    data[foundIdx] = data[targetIdx];
    data[targetIdx] = tmp;
    saveData(data);
    var list = document.getElementById('cardList');
    list.innerHTML = '';
    renderMain();
    renderTOC();
}

function renderTOC() {
    var data = getData();
    document.getElementById('tocCount').textContent = data.length + ' 条';

    // 按日期分组
    var groups = {};
    var dateOrder = [];
    for (var i = 0; i < data.length; i++) {
        var dt = data[i].date || '未知日期';
        if (!groups[dt]) { groups[dt] = []; dateOrder.push(dt); }
        groups[dt].push(data[i]);
    }

    var html = '';
    // 日期按时间倒序排列（最新在前）
    dateOrder.sort().reverse();
    for (var gi = 0; gi < dateOrder.length; gi++) {
        var dateKey = dateOrder[gi];
        var items = groups[dateKey];
        var dKey = 'date_' + dateKey;
        var dCollapsed = tocCollapsed[dKey];
        html += '<div class="toc-date" onclick="toggleTocGroup(&#39;' + dKey + '&#39;)">'
             + '<span class="toc-toggle">' + (dCollapsed ? '▶' : '▼') + '</span>'
             + escapeHtml(dateKey) + '<span class="count">(' + items.length + ')</span>'
             + '</div>';
        if (dCollapsed) continue;

        // 在日期内按层级建树
        var roots = [];
        var stack = []; // 当前嵌套路径
        for (var i = 0; i < items.length; i++) {
            var it = items[i];
            var lvl = Math.min(Math.max(it.level || 0, 0), 4);
            while (stack.length > 0 && stack[stack.length-1].level >= lvl) stack.pop();
            var node = { tid: it.tid, title: it.title || '(无标题)', level: lvl, children: [],
                         canUp: i > 0, canDown: i < items.length - 1 };
            if (stack.length === 0) {
                roots.push(node);
            } else {
                stack[stack.length-1].children.push(node);
            }
            stack.push(node);
        }
        for (var ri = 0; ri < roots.length; ri++) {
            html += renderTocNode(roots[ri], 0);
        }
    }
    document.getElementById('tocList').innerHTML = html;
}

function renderTocNode(node, depth) {
    var key = 'node_' + node.tid;
    var collapsed = tocCollapsed[key];
    var hasKids = node.children && node.children.length > 0;
    var title = escapeHtml(node.title.substring(0, 40));
    var html = '<div class="toc-row lvl-' + node.level + '">';
    html += '<span class="toc-toggle" onclick="event.stopPropagation();toggleTocGroup(&#39;' + key + '&#39;)" style="' + (hasKids ? '' : 'visibility:hidden') + '">' + (collapsed ? '▶' : '▼') + '</span>';
    html += '<span class="toc-item" data-tid="' + escapeHtml(node.tid) + '" onclick="scrollToToc(&#39;' + escapeHtml(node.tid) + '&#39;)" title="' + escapeHtml(node.title) + '">' + title + '</span>';
    if (tocEditMode) {
        html += '<span class="toc-arrows">';
        html += '<button class="toc-arrow-btn" onclick="moveItem(&#39;' + escapeHtml(node.tid) + '&#39;,-1)" title="上移" style="' + (node.canUp ? '' : 'visibility:hidden') + '">↑</button>';
        html += '<button class="toc-arrow-btn" onclick="moveItem(&#39;' + escapeHtml(node.tid) + '&#39;,1)" title="下移" style="' + (node.canDown ? '' : 'visibility:hidden') + '">↓</button>';
        html += '</span>';
    }
    html += '</div>';
    if (!collapsed && hasKids) {
        for (var i = 0; i < node.children.length; i++) {
            html += renderTocNode(node.children[i], depth + 1);
        }
    }
    return html;
}

function toggleTocGroup(key) {
    tocCollapsed[key] = !tocCollapsed[key];
    renderTOC();
}

function renderMain() {
    // 保存编辑状态（支持全部编辑模式）
    var allInputs = document.querySelectorAll('.edit-input');
    var isBulkEdit = allInputs.length > 1 || (allInputs.length === 1 && document.getElementById('btnEditAll') && document.getElementById('btnEditAll').textContent.indexOf('保存') >= 0);
    var editingInputs = {};  // tid -> value
    for (var i = 0; i < allInputs.length; i++) {
        var card = allInputs[i].closest('.card');
        if (card) editingInputs[card.dataset.tid] = allInputs[i].value;
    }

    var data = getData();
    document.getElementById('totalCount').textContent = data.length;
    var list = document.getElementById('cardList');
    var empty = document.getElementById('emptyMsg');
    if (data.length === 0) {
        list.innerHTML = '';
        empty.style.display = 'block';
        document.getElementById('dateFilters').innerHTML = '';
        document.getElementById('sectorFilters').innerHTML = '';
        return;
    }
    empty.style.display = 'none';

    // 保存筛选状态（必须在重建filter之前）
    var curActiveDate = document.querySelector('.date-filter.active');
    var savedDate = 'all';
    if (curActiveDate && curActiveDate.textContent.indexOf('全部') !== 0) savedDate = curActiveDate.textContent;
    var curActiveSector = document.querySelector('.sector-filter.active');
    var savedSector = '全部板块';
    if (curActiveSector && curActiveSector.textContent.indexOf('全部') !== 0) savedSector = curActiveSector.textContent;

    var dates = {};
    var sectors = {};
    for (var i = 0; i < data.length; i++) {
        var d = data[i].date || '(无日期)';
        if (!dates[d]) dates[d] = 0;
        dates[d]++;
        var s = data[i].sector || '其他';
        if (!sectors[s]) sectors[s] = 0;
        sectors[s]++;
    }
    var df = '<button class="filter-btn date-filter' + (savedDate === 'all' ? ' active' : '') + '" onclick="filterBy(&#39;date&#39;,&#39;all&#39;)">全部(' + data.length + ')</button>';
    var dkeys = Object.keys(dates).sort().reverse();
    for (var i = 0; i < dkeys.length; i++) {
        df += '<button class="filter-btn date-filter' + (dkeys[i] === savedDate ? ' active' : '') + '" onclick="filterBy(&#39;date&#39;,&#39;' + dkeys[i] + '&#39;)">' + dkeys[i] + '</button>';
    }
    document.getElementById('dateFilters').innerHTML = df;
    var sf = '<button class="filter-btn sector-filter' + (savedSector === '全部板块' ? ' active' : '') + '" onclick="filterBy(&#39;sector&#39;,&#39;all&#39;)">全部板块</button>';
    var skeys = Object.keys(sectors).sort();
    for (var i = 0; i < skeys.length; i++) {
        sf += '<button class="filter-btn sector-filter' + (skeys[i] === savedSector ? ' active' : '') + '" onclick="filterBy(&#39;sector&#39;,&#39;' + skeys[i] + '&#39;)">' + skeys[i] + '</button>';
    }
    document.getElementById('sectorFilters').innerHTML = sf;

    var selDate = savedDate;
    var selSector = savedSector;

    // 按目录相同的树遍历顺序渲染卡片（与 renderTOC 保持一致）
    var html = '';
    // 按日期分组，每组内按层级建树
    var dateGroups = {};
    var dateOrder2 = [];
    for (var i = 0; i < data.length; i++) {
        var d = data[i];
        var dt = d.date || '未知日期';
        if (!dateGroups[dt]) { dateGroups[dt] = []; dateOrder2.push(dt); }
        dateGroups[dt].push(d);
    }
    dateOrder2.sort().reverse();
    for (var gi = 0; gi < dateOrder2.length; gi++) {
        var dateKey = dateOrder2[gi];
        var items = dateGroups[dateKey];
        // 建树
        var rts = [];
        var st = [];
        for (var k = 0; k < items.length; k++) {
            var it = items[k];
            var lv = Math.min(Math.max(it.level || 0, 0), 4);
            while (st.length > 0 && st[st.length-1].level >= lv) st.pop();
            var nd = { d: it, level: lv, children: [] };
            if (st.length === 0) { rts.push(nd); } else { st[st.length-1].children.push(nd); }
            st.push(nd);
        }
        // 深度优先遍历输出卡片
        html += renderCardsDF(rts, selDate, selSector);
    }
    list.innerHTML = html;

    // 恢复编辑状态（支持批量）
    var tids = Object.keys(editingInputs);
    for (var j = 0; j < tids.length; j++) {
        var tid = tids[j];
        var titleEl = document.getElementById('title-' + tid);
        if (titleEl) {
            titleEl.innerHTML = '';
            var inp = document.createElement('input');
            inp.type = 'text';
            inp.className = 'edit-input';
            inp.value = editingInputs[tid];
            inp.setAttribute('spellcheck', 'false');
            titleEl.appendChild(inp);
            titleEl.classList.add('editing');
        }
    }
    if (isBulkEdit && tids.length > 0) {
        document.getElementById('btnEditAll').innerHTML = '✔ 全部保存';
        var firstInp = document.querySelector('.edit-input');
        if (firstInp) setTimeout(function() { firstInp.focus(); }, 50);
    } else if (tids.length === 1) {
        var inp = document.querySelector('.edit-input');
        if (inp) setTimeout(function() { inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length); }, 50);
    }
}

function renderCardsDF(nodes, selDate, selSector) {
    var h = '';
    for (var i = 0; i < nodes.length; i++) {
        var nd = nodes[i];
        var d = nd.d;
        var showDate = (selDate === 'all' || (d.date || '(无日期)') === selDate);
        var showSector = (selSector === '全部板块' || (d.sector || '其他') === selSector);
        var hidden = (selDate !== 'all' || selSector !== '全部板块') && (!showDate || !showSector);
        var color = PALETTE[d.sector] || '#7f8c8d';
        var lvl = Math.min(Math.max(d.level || 0, 0), 4);
        var tid = escapeHtml(d.tid);
        h += '<div class="card card-lvl-' + lvl + '" data-tid="' + tid + '" data-sector="' + escapeHtml(d.sector || '其他') + '" data-date="' + escapeHtml(d.date || '') + '"'
             + (hidden ? ' style="display:none"' : '') + '>'
             + '  <div class="card-header">'
             + '    <span class="sector-tag" style="background:' + color + '">' + escapeHtml(d.sector || '其他') + '</span>'
             + '    <span class="time">L' + lvl + ' · ' + escapeHtml(d.date || '') + ' ' + escapeHtml(d.time || '') + '</span>'
             + '    <span class="author">@' + escapeHtml(d.author || '') + '</span>'
             + '    <span style="flex:1"></span>'
             + '    <span class="lvl-select">'
             + '      <span class="lvl-dot' + (lvl===0?' current':'') + '" onclick="changeLevel(&#39;' + tid + '&#39;,0,event)" title="L0 根级">0</span>'
             + '      <span class="lvl-dot l1' + (lvl===1?' current':'') + '" onclick="changeLevel(&#39;' + tid + '&#39;,1,event)" title="L1 一级">1</span>'
             + '      <span class="lvl-dot l2' + (lvl===2?' current':'') + '" onclick="changeLevel(&#39;' + tid + '&#39;,2,event)" title="L2 二级">2</span>'
             + '      <span class="lvl-dot l3' + (lvl===3?' current':'') + '" onclick="changeLevel(&#39;' + tid + '&#39;,3,event)" title="L3 三级">3</span>'
             + '      <span class="lvl-dot l4' + (lvl===4?' current':'') + '" onclick="changeLevel(&#39;' + tid + '&#39;,4,event)" title="L4 四级">4</span>'
             + '    </span>'
             + '    <button class="edit-btn" onclick="toggleEdit(&#39;' + tid + '&#39;)">✎ 编辑</button>'
             + '    <button class="delete-btn" onclick="removeOne(&#39;' + tid + '&#39;)">删除</button>'
             + '  </div>'
             + '  <div class="card-title" id="title-' + tid + '">' + escapeHtml(d.title || '') + '</div>'
             + '  <div class="card-body">' + escapeHtml(d.content || '') + '</div>'
             + '  <div class="card-footer">' + (d.link ? '<a href="' + escapeHtml(d.link) + '" target="_blank">星球原文</a>' : '') + '</div>'
             + '</div>';
        if (nd.children.length > 0) {
            h += renderCardsDF(nd.children, selDate, selSector);
        }
    }
    return h;
}

function render() {
    renderMain();
    renderTOC();
}

function isEditing() {
    return document.querySelector('.edit-input') !== null;
}

function filterBy(type, val) {
    var btns = document.querySelectorAll(type === 'date' ? '.date-filter' : '.sector-filter');
    for (var i = 0; i < btns.length; i++) btns[i].classList.remove('active');
    event.target.classList.add('active');
    var selDate = document.querySelector('.date-filter.active');
    var dVal = 'all';
    if (selDate && selDate.textContent.indexOf('全部') !== 0) dVal = selDate.textContent;
    var selSector = document.querySelector('.sector-filter.active');
    var sVal = '全部板块';
    if (selSector) sVal = selSector.textContent;
    var cards = document.querySelectorAll('#cardList .card');
    for (var i = 0; i < cards.length; i++) {
        var cDate = cards[i].dataset.date || '(无日期)';
        var cSec = cards[i].dataset.sector || '其他';
        var show = (dVal === 'all' || cDate === dVal) && (sVal === '全部板块' || cSec === sVal);
        cards[i].style.display = show ? '' : 'none';
    }
}

function removeOne(tid) {
    if (!confirm('确定删除这条收藏？')) return;
    var data = getData();
    data = data.filter(function(i){ return i.tid !== tid; });
    deletedTids.add(tid);
    saveData(data);
    render();
}

function clearAll() {
    if (!confirm('确定清空所有收藏？此操作不可恢复！')) return;
    var data = getData();
    for (var i = 0; i < data.length; i++) deletedTids.add(data[i].tid);
    saveData([]);
    render();
}

render();
document.getElementById('syncStatus').textContent = '当前: ' + getData().length + ' 条 | ✅ 已保存';

// 自动迁移: 给已有书签补 level 字段
(function patchLevels() {
    var data = getData();
    var changed = false;
    for (var i = 0; i < data.length; i++) {
        if (typeof data[i].level === 'undefined') {
            data[i].level = 1;
            changed = true;
        }
    }
    if (changed) {
        saveData(data);
        render();
    }
})();

// 自动迁移: 从 zsxq_bm_* key 名给已有书签补日期
(function patchDates() {
    var data = getData();
    if (data.length === 0) return;
    var bmMap = {};
    for (var k in localStorage) {
        if (k.indexOf('zsxq_bm_') !== 0) continue;
        var dt = k.substring(8);
        var bm = {};
        try { bm = JSON.parse(localStorage.getItem(k) || '{}'); } catch(e) { continue; }
        for (var tid in bm) { bmMap[tid] = dt; }
    }
    var changed = false;
    for (var i = 0; i < data.length; i++) {
        if ((!data[i].date || data[i].date === '(无日期)') && bmMap[data[i].tid]) {
            data[i].date = bmMap[data[i].tid];
            changed = true;
        }
    }
    if (changed) {
        saveData(data);
        render();
        document.getElementById('syncStatus').textContent = '当前: ' + data.length + ' 条 (日期已补全)';
    }
})();

// 尝试从日报书签中恢复缺失的条目
setTimeout(function() {
    var data = getData();
    var ids = {};
    for (var i = 0; i < data.length; i++) ids[data[i].tid] = true;
    // 加载 zsxq_saved 中的完整数据，用于补全书签内容
    var persisted = {};
    try { var sv = JSON.parse(localStorage.getItem('zsxq_saved') || '[]'); for (var s = 0; s < sv.length; s++) persisted[sv[s].tid] = sv[s]; } catch(e) {}
    var added = false;
    for (var k in localStorage) {
        if (k.indexOf('zsxq_bm_') !== 0) continue;
        var dt = k.substring(8);
        var bm = {};
        try { bm = JSON.parse(localStorage.getItem(k) || '{}'); } catch(e) { continue; }
        for (var tid in bm) {
            if (ids[tid]) continue;
            if (deletedTids.has(tid)) continue;
            // 优先使用 zsxq_saved 中的完整数据，没有才用占位符
            var item;
            if (persisted[tid]) {
                item = persisted[tid];
                if (!item.date) item.date = dt;
                if (typeof item.level === 'undefined') item.level = 1;
            } else {
                item = { tid: tid, title: bm[tid], content: '[点击日报中的 ☆ 重新收藏以获取全文]', sector: '其他', author: '', time: '', link: '', date: dt, level: 1 };
            }
            var insertAt = 0;
            for (var x = 0; x < data.length; x++) {
                if ((data[x].date || '') === dt) { insertAt = x; break; }
                insertAt = x + 1;
            }
            data.splice(insertAt, 0, item);
            ids[tid] = true;
            added = true;
        }
    }
    if (added) {
        saveData(data);
        render();
    }
}, 1000);

document.addEventListener('visibilitychange', function() {
    if (!document.hidden && !isEditing()) { render(); updateSaveBtn(); }
});
window.addEventListener('pageshow', function() {
    if (!isEditing()) { render(); }
    updateSaveBtn();
});
window.addEventListener('pagehide', function() {
    var inp = document.querySelector('.edit-input');
    if (inp) {
        var card = inp.closest('.card');
        if (card) updateTitle(card.dataset.tid, inp.value);
    }
});
window.addEventListener('beforeunload', function(e) {
    if (hasUnsaved) { e.preventDefault(); e.returnValue = ''; }
});

setInterval(function() {
    if (!document.hidden && !isEditing()) { render(); updateSaveBtn(); }
}, 2000);

// ========== 每日图片画廊 ==========
var IMAGE_GALLERIES = [{ date: "2026-09-02", label: "9/2", folder: "2026-09/调研纪要_2026-09-02_图片PNG", count: 24 }];
var ZT_SUMMARIES = [];
var currentGalleryDate = '';
var currentLightboxIdx = 0;
var currentLightboxImages = [];

function switchTab(tab, evt) {
    var btns = document.querySelectorAll('.tab-btn');
    for (var i = 0; i < btns.length; i++) btns[i].classList.remove('active');
    var contents = document.querySelectorAll('.tab-content');
    for (var i = 0; i < contents.length; i++) contents[i].classList.remove('active');
    if (evt && evt.target) evt.target.classList.add('active');
    document.getElementById('tab-' + tab).classList.add('active');
    if (tab === 'gallery') {
        renderGalleryDates();
        if (!currentGalleryDate && IMAGE_GALLERIES.length > 0) {
            selectGalleryDate(IMAGE_GALLERIES[IMAGE_GALLERIES.length - 1].date);
        }
    }
    if (tab === 'zt') {
        initZtTab();
    }
}

function renderGalleryDates() {
    var html = '<span style="font-size:12px;color:#666;font-weight:600;margin-right:4px">📅 日期</span>';
    for (var i = IMAGE_GALLERIES.length - 1; i >= 0; i--) {
        var g = IMAGE_GALLERIES[i];
        html += '<button class="gallery-date-btn' + (g.date === currentGalleryDate ? ' active' : '') +
                '" onclick="selectGalleryDate(\'' + g.date + '\')">' + g.label + ' (' + g.count + '张)</button>';
    }
    document.getElementById('galleryDateFilters').innerHTML = html;
}

function selectGalleryDate(date) {
    currentGalleryDate = date;
    renderGalleryDates();
    renderGalleryGrid();
}

function renderGalleryGrid() {
    var gallery = null;
    for (var i = 0; i < IMAGE_GALLERIES.length; i++) {
        if (IMAGE_GALLERIES[i].date === currentGalleryDate) { gallery = IMAGE_GALLERIES[i]; break; }
    }
    if (!gallery) {
        document.getElementById('galleryGrid').innerHTML = '<div style="text-align:center;padding:40px;color:#999">请选择日期</div>';
        return;
    }
    var html = '';
    for (var i = 1; i <= gallery.count; i++) {
        var num = String(i).padStart(2, '0');
        var src = gallery.folder + '/' + num + '.png';
        html += '<div class="gallery-item" onclick="openLightbox(\'' + gallery.date + '\',' + i + ')">' +
                '<img src="' + src + '" loading="lazy" onerror="this.parentElement.style.display=\'none\'" />' +
                '<span class="img-num">' + num + '</span>' +
                '</div>';
    }
    document.getElementById('galleryGrid').innerHTML = html;
}

// ── 涨停复盘 ──
var currentZtDate = null;

function initZtTab() {
    var ctns = document.getElementById('ztDateFilters');
    if (!ctns || !ZT_SUMMARIES.length) return;
    if (!currentZtDate) currentZtDate = ZT_SUMMARIES[0].date;
    var html = '';
    for (var i = 0; i < ZT_SUMMARIES.length; i++) {
        var z = ZT_SUMMARIES[i];
        var parts = z.date.split('-');
        var label = parseInt(parts[1]) + '/' + parseInt(parts[2]);
        var cls = 'gallery-date-btn' + (z.date === currentZtDate ? ' active' : '');
        html += '<button class="' + cls + '" onclick="selectZtDate(\'' + z.date + '\')">' + label + '</button>';
    }
    ctns.innerHTML = html;
    selectZtDate(currentZtDate);
}

function selectZtDate(date) {
    currentZtDate = date;
    var z = null;
    for (var i = 0; i < ZT_SUMMARIES.length; i++) {
        if (ZT_SUMMARIES[i].date === date) { z = ZT_SUMMARIES[i]; break; }
    }
    if (!z) return;
    var btns = document.querySelectorAll('#ztDateFilters .gallery-date-btn');
    for (var j = 0; j < btns.length; j++) {
        btns[j].classList.toggle('active', btns[j].textContent === date.substring(5));
    }
    renderZt(z);
}

function renderZt(z) {
    if (!z.total) {
        document.getElementById('ztContent').innerHTML = '<div class="zt-empty">📊 ' + z.date + ' 暂无涨停数据<br><span style="font-size:12px;color:#bbb">（非交易日或数据尚未生成）</span></div>';
        return;
    }
    var html = '';
    // 统计卡片
    html += '<div class="zt-stats">';
    html += '<div class="zt-stat"><div class="val red">' + z.total + '</div><div class="lbl">📈 涨停总数</div></div>';
    html += '<div class="zt-stat"><div class="val green">' + z.count_20 + '</div><div class="lbl">🚀 20%涨停</div></div>';
    html += '<div class="zt-stat"><div class="val">' + z.count_10 + '</div><div class="lbl">📊 10%涨停</div></div>';
    html += '</div>';
    // 热门题材
    if (z.top_tags && z.top_tags.length) {
        html += '<div class="zt-tags"><h3>🔥 热门题材</h3>';
        for (var t = 0; t < z.top_tags.length; t++) {
            var tag = z.top_tags[t];
            html += '<span class="zt-tag">' + escapeHtml(tag.name) + ' <span class="cnt">' + tag.count + '只</span></span>';
        }
        html += '</div>';
    }
    // 涨停列表
    if (z.stocks && z.stocks.length) {
        html += '<div class="zt-table-wrap"><table class="zt-table">';
        html += '<thead><tr><th>#</th><th>代码</th><th>名称</th><th>题材归因</th><th>市场</th></tr></thead><tbody>';
        for (var s = 0; s < z.stocks.length; s++) {
            var st = z.stocks[s];
            var mc = st.market || '';
            var mcCls = 'zt-market-tag';
            if (mc.indexOf('上海') >= 0) mcCls += ' sh';
            else if (mc.indexOf('ST') >= 0) mcCls += ' st';
            else mcCls += ' sz';
            html += '<tr><td>' + (s + 1) + '</td>' +
                    '<td><span class="zt-code">' + escapeHtml(st.code) + '</span></td>' +
                    '<td style="font-weight:600;color:#2c3e50">' + escapeHtml(st.name) + '</td>' +
                    '<td><span class="zt-reason">' + escapeHtml(st.reason) + '</span></td>' +
                    '<td><span class="' + mcCls + '">' + escapeHtml(mc) + '</span></td></tr>';
        }
        html += '</tbody></table></div>';
    }
    document.getElementById('ztContent').innerHTML = html;
}

function openLightbox(date, idx) {
    var gallery = null;
    for (var i = 0; i < IMAGE_GALLERIES.length; i++) {
        if (IMAGE_GALLERIES[i].date === date) { gallery = IMAGE_GALLERIES[i]; break; }
    }
    if (!gallery) return;
    currentLightboxImages = [];
    for (var i = 1; i <= gallery.count; i++) {
        currentLightboxImages.push(gallery.folder + '/' + String(i).padStart(2, '0') + '.png');
    }
    currentLightboxIdx = idx - 1;
    showLightbox();
}

var lightboxZoom = 1;

function showLightbox() {
    var existing = document.getElementById('lightbox');
    if (existing) { existing.remove(); window.removeEventListener('wheel', lightboxSideHandler, true); }
    lightboxZoom = 1;
    var lb = document.createElement('div');
    lb.id = 'lightbox';
    lb.className = 'lightbox';
    lb.onclick = function(e) { if (e.target === lb) closeLightbox(); };
    lb.innerHTML =
        '<span class="lightbox-close" onclick="closeLightbox()">&times;</span>' +
        '<span class="lightbox-nav lightbox-prev" onclick="navLightbox(-1)">&lsaquo;</span>' +
        '<div class="lightbox-inner"><img src="' + currentLightboxImages[currentLightboxIdx] + '" onclick="event.stopPropagation();toggleLightboxZoom()" /></div>' +
        '<span class="lightbox-nav lightbox-next" onclick="navLightbox(1)">&rsaquo;</span>' +
        '<div class="lightbox-info">' + (currentLightboxIdx + 1) + ' / ' + currentLightboxImages.length + ' <span id="zoomHint" class="lightbox-zoom-hint"></span></div>';
    document.body.appendChild(lb);
    document.body.style.overflow = 'hidden';
    document.documentElement.style.overflow = 'hidden';
    document.addEventListener('keydown', lightboxKeyHandler);
    window.addEventListener('wheel', lightboxSideHandler, {passive: false, capture: true});
}

function toggleLightboxZoom() {
    var img = document.querySelector('#lightbox img');
    if (!img) return;
    if (lightboxZoom < 1.1) { lightboxZoom = 2; img.classList.add('zoomed'); }
    else if (lightboxZoom < 2.1) { lightboxZoom = 3; }
    else if (lightboxZoom < 3.1) { lightboxZoom = 4; }
    else { lightboxZoom = 1; img.classList.remove('zoomed'); }
    img.style.transform = 'scale(' + lightboxZoom + ')';
    showZoomHint();
}

function lightboxSideHandler(e) {
    // 接管所有滚轮: deltaX≠0→缩放, deltaY≠0→滚动
    var lb = document.getElementById('lightbox');
    if (!lb) return;
    e.preventDefault();
    e.stopPropagation();
    if (Math.abs(e.deltaX) > 0 || e.shiftKey) {
        // 左滚轮(deltaX) 或 Shift+滚轮 → 缩放
        var img = lb.querySelector('img');
        if (!img) return;
        var step = e.shiftKey ? (e.deltaY > 0 ? 0.2 : -0.2) : (e.deltaX > 0 ? 0.2 : -0.2);
        lightboxZoom = Math.max(0.4, Math.min(5, lightboxZoom + step));
        if (lightboxZoom > 1) { img.classList.add('zoomed'); }
        else { img.classList.remove('zoomed'); }
        img.style.transform = 'scale(' + lightboxZoom + ')';
        showZoomHint();
    } else if (Math.abs(e.deltaY) > 0) {
        lb.scrollBy(0, e.deltaY);
    }
}

function showZoomHint() {
    var hint = document.getElementById('zoomHint');
    if (hint) {
        hint.textContent = '🔍 ' + Math.round(lightboxZoom * 100) + '%  (左滚轮/Shift+滚轮缩放 | 点击切换)';
        hint.classList.add('show');
        clearTimeout(hint._timeout);
        hint._timeout = setTimeout(function(){ hint.classList.remove('show'); }, 1500);
    }
}

function navLightbox(dir) {
    currentLightboxIdx = (currentLightboxIdx + dir + currentLightboxImages.length) % currentLightboxImages.length;
    showLightbox();
}

function closeLightbox() {
    var lb = document.getElementById('lightbox');
    if (lb) { lb.remove(); window.removeEventListener('wheel', lightboxSideHandler, true); }
    document.removeEventListener('keydown', lightboxKeyHandler);
    document.body.style.overflow = '';
    document.documentElement.style.overflow = '';
}

function lightboxKeyHandler(e) {
    if (e.key === 'Escape') closeLightbox();
    else if (e.key === 'ArrowLeft') navLightbox(-1);
    else if (e.key === 'ArrowRight') navLightbox(1);
}
</script>
